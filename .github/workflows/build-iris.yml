
name: Build Iris for Paper 26.2

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build-paper.yml'
      - '**/*.java'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'

permissions:
  contents: read

concurrency:
  group: iris-paper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile Paper plugin
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Iris
        uses: actions/checkout@v4

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Bukkit/Paper plugin
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew buildBukkit \
            --no-daemon \
            --no-parallel \
            --max-workers=2 \
            -PuseLocalVolmLib=false \
            -PpluginOutDirectory=build/ci-output \
            --stacktrace

      - name: Verify JAR and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          jars=(build/ci-output/*.jar)

          if (( ${#jars[@]} == 0 )); then
            echo "::error::No Paper plugin JAR was produced."
            echo "Checking possible Gradle output directories:"
            find . -type f -name '*.jar' \
              -not -path './.gradle/*' || true
            exit 1
          fi

          sha256sum "${jars[@]}" \
            | tee build/ci-output/SHA256SUMS.txt

          {
            echo "## Iris Paper build"
            echo ""
            echo "Commit: \`${GITHUB_SHA}\`"
            echo ""
            echo "JAR files and SHA-256 checksums are available in the artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compiled plugin
        uses: actions/upload-artifact@v4
        with:
          name: Iris-Paper-26.2
          path: |
            build/ci-output/*.jar
            build/ci-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
