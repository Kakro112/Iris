
name: Compile Paper plugin

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iris-paper-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Iris Bukkit plugin
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Iris
        uses: actions/checkout@v4
        with:
          path: Iris

      - name: Checkout VolmLib
        uses: actions/checkout@v4
        with:
          repository: VolmitSoftware/VolmLib
          ref: master
          path: VolmLib

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: Iris/**/*.gradle*

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Bukkit plugin
        working-directory: Iris
        env:
          VOLMLIB_DIR: ${{ github.workspace }}/VolmLib
        run: |
          chmod +x ./gradlew

          ./gradlew buildBukkit \
            --no-daemon \
            --no-parallel \
            --max-workers=2 \
            -PuseLocalVolmLib=true \
            -PlocalVolmLibDirectory="$VOLMLIB_DIR" \
            -PpluginOutDirectory=build/ci-output \
            --stacktrace

      - name: Upload plugin JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Iris-Bukkit-${{ github.sha }}
          path: Iris/build/ci-output/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Iris-build-diagnostics-${{ github.run_id }}
          path: |
            Iris/**/build/reports/**
            Iris/**/build/test-results/**
            Iris/**/build/tmp/**
          if-no-files-found: ignore
          retention-days: 7
