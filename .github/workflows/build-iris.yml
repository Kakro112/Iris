name: Build Iris for Paper 26.2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - arena/d71f50a6-iris

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Iris 26.2 release
        uses: actions/checkout@v5
        with:
          repository: VolmitSoftware/Iris
          ref: 4.1.1-26.1.2-26.2
          fetch-depth: 1

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # JitPack cannot build VolmLib (Java 25 toolchain, no jitpack.yml), so the
      # pinned com.github.VolmitSoftware.VolmLib artifacts are never served. The
      # Iris build already supports a source checkout via VOLMLIB_DIR / a sibling
      # VolmLib directory: gradle/volmlib-resolution.settings.gradle substitutes
      # the packaging plugin and volmlib-shared with the matching projects.
      - name: Fetch matching VolmLib sources
        shell: bash
        env:
          # gradle.properties pins 6c54bbcd, but Iris 4.1.1-26.2 compiles against
          # art.arcane.volmlib.util.event.ProtectionProbe, which VolmLib only added in
          # 2829806f (the maintainers build with a live VolmLib checkout; the published
          # pin is stale). 2829806f is the first VolmLib commit with that class and the
          # last one published before the Iris 4.1.1-26.2 release.
          VOLMLIB_REV: 2829806f047b35735b29375930e3777d431480b4
        run: |
          rev="$VOLMLIB_REV"
          if [ -z "$rev" ]; then
            rev=$(grep -oE 'volmlib-shared:[0-9a-f]+' gradle.properties | head -1 | cut -d: -f2)
          fi
          if [ -z "$rev" ]; then
            echo "Could not determine VolmLib revision"
            exit 1
          fi
          echo "VolmLib revision: $rev"
          curl -fsSL -o /tmp/volmlib.tar.gz "https://codeload.github.com/VolmitSoftware/VolmLib/tar.gz/$rev"
          mkdir -p "$GITHUB_WORKSPACE/../VolmLib"
          tar -xzf /tmp/volmlib.tar.gz --strip-components=1 -C "$GITHUB_WORKSPACE/../VolmLib"
          test -f "$GITHUB_WORKSPACE/../VolmLib/settings.gradle"

      # com.willfp:eco only exists on repo.auxilor.io, which goes down behind
      # Cloudflare 5xx now and then and breaks dependency resolution hard. When
      # it is unreachable, build the pinned eco-api release from source (its
      # :eco-api module publishes exactly com.willfp:eco:<version> to mavenLocal)
      # and let Iris resolve it from there with -PuseMavenLocal=true.
      - name: Check Auxilor Maven repo
        id: auxilor
        shell: bash
        run: |
          eco_ver=$(grep -oE 'eco = "[^"]+"' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          echo "eco=$eco_ver" >> "$GITHUB_OUTPUT"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            "https://repo.auxilor.io/repository/maven-public/com/willfp/eco/$eco_ver/eco-$eco_ver.pom" || echo 000)
          echo "http=$code" >> "$GITHUB_OUTPUT"
          echo "Auxilor repo HTTP status for eco $eco_ver: $code"

      - name: Build eco API from source (Auxilor outage fallback)
        if: steps.auxilor.outputs.http != '200'
        shell: bash
        run: |
          eco_ver="${{ steps.auxilor.outputs.eco }}"
          echo "Building com.willfp:eco:$eco_ver from source"
          git clone --depth 1 --branch "$eco_ver" https://github.com/Auxilor/eco.git /tmp/eco
          # The downed host is unscoped in eco's build, so its 5xx errors abort
          # resolution of unrelated artifacts. Remove it; nothing else needs it.
          sed -i '/repo\.auxilor\.io/d' /tmp/eco/build.gradle.kts
          cd /tmp/eco
          ./gradlew :eco-api:publishToMavenLocal --no-daemon --stacktrace
          ls -la "$HOME/.m2/repository/com/willfp/eco/$eco_ver/"

      - name: Build Paper plugin
        shell: bash
        env:
          VOLMLIB_DIR: ${{ github.workspace }}/../VolmLib
        run: |
          set -o pipefail
          java -version 2>&1 | tee gradle-build.log
          for attempt in 1 2 3; do
            echo "=== Build attempt $attempt ===" | tee -a gradle-build.log
            if ./gradlew buildBukkit --no-daemon -PuseMavenLocal=true --stacktrace 2>&1 | tee -a gradle-build.log; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying..." | tee -a gradle-build.log
            sleep 20
          done
          exit 1

      - name: Report failure details
        if: failure()
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import os

          def encode(text: str) -> str:
              return text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          path = 'gradle-build.log'
          if not os.path.exists(path):
              print('::error title=Build log missing::gradle-build.log was not produced')
              raise SystemExit(0)

          with open(path, 'rb') as handle:
              log = handle.read().decode('utf-8', 'replace')

          # Drop stack-trace frames so the error chain fits in annotations.
          kept = []
          for line in log.splitlines(keepends=True):
              stripped = line.lstrip()
              if stripped.startswith('at ') or stripped.startswith('... '):
                  continue
              kept.append(line)
          text = ''.join(kept)
          for marker in ('FAILURE:', 'What went wrong'):
              idx = text.rfind(marker)
              if idx != -1:
                  text = text[idx:]
                  break
          text = text[-6000:]

          chunks = []
          current = ''
          for line in text.splitlines(keepends=True):
              encoded_line = encode(line)
              if len(current) + len(encoded_line) > 3500:
                  chunks.append(current)
                  current = encoded_line
              else:
                  current += encoded_line
          if current:
              chunks.append(current)

          chunks = chunks[-9:]
          for index, chunk in enumerate(chunks, 1):
              print(f'::error title=Gradle error {index}/{len(chunks)}::{chunk}')

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Gradle failure\n\n```\n')
              summary.write(text[-4000:])
              summary.write('\n```\n')
          PYEOF

      - name: Locate generated JARs
        if: always()
        shell: bash
        run: |
          echo "Searching for generated JAR files..."
          find . ../PluginOuts -type f -name '*.jar' 2>/dev/null || true

      - name: Collect Paper plugin JAR
        if: success()
        shell: bash
        run: |
          mkdir -p artifacts

          find ../PluginOuts . \
            -type f \
            -name '*CraftBukkit*.jar' \
            ! -path './artifacts/*' \
            ! -path './gradle/*' \
            -exec cp {} artifacts/ \; 2>/dev/null || true

          if [ -z "$(find artifacts -type f -name '*.jar' -print -quit)" ]; then
            echo "No CraftBukkit plugin JAR found."
            echo "Check the Locate generated JARs step for the actual output path."
            exit 1
          fi

          ls -lh artifacts

      - name: Upload Paper plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Iris-Paper-26.2
          path: artifacts/*.jar
          if-no-files-found: error
          retention-days: 14
