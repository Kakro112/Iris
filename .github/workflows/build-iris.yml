
name: Build Iris for Paper 26.2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Iris 26.2 release
        uses: actions/checkout@v4
        with:
          repository: VolmitSoftware/Iris
          ref: 4.1.1-26.1.2-26.2
          fetch-depth: 1

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Paper plugin
        run: ./gradlew buildBukkit --no-daemon

      - name: Export all platform artifacts if needed
        if: failure()
        run: ./gradlew buildAllToOut --no-daemon

      - name: Locate generated JARs
        if: always()
        run: |
          echo "Searching for generated JAR files..."
          find . ../PluginOuts -type f -name '*.jar' 2>/dev/null || true

      - name: Collect Paper plugin JAR
        if: success()
        shell: bash
        run: |
          mkdir -p artifacts

          find ../PluginOuts . \
            -type f \
            -name '*CraftBukkit*.jar' \
            ! -path './artifacts/*' \
            -exec cp {} artifacts/ \; 2>/dev/null || true

          if [ -z "$(find artifacts -type f -name '*.jar' -print -quit)" ]; then
            echo "No CraftBukkit plugin JAR found."
            echo "Check the Locate generated JARs step for the actual output path."
            exit 1
          fi

          ls -lh artifacts

      - name: Upload Paper plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Iris-Paper-26.2
          path: artifacts/*.jar
          if-no-files-found: error
          retention-days: 14
