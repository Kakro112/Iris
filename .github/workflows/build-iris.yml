
name: Build Iris for Paper 26.2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Paper plugin
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Iris 26.2 source
        uses: actions/checkout@v4
        with:
          repository: VolmitSoftware/Iris
          ref: b18681a
          fetch-depth: 1

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Bukkit/Paper plugin
        run: ./gradlew buildBukkit --no-daemon

      - name: Upload Paper plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: Iris-Paper-26.2
          path: ../PluginOuts/*CraftBukkit*26.2*.jar
          if-no-files-found: warn
          retention-days: 14
