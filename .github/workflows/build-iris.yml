
name: Build Iris Paper 26.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Iris source
        uses: actions/checkout@v4
        with:
          repository: VolmitSoftware/Iris
          ref: b18681a
          fetch-depth: 1

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build Iris
        run: ./gradlew buildAllToOut --no-daemon

      - name: Prepare Paper JAR
        shell: bash
        run: |
          mkdir -p artifacts
          find ../PluginOuts -maxdepth 1 -type f \
            -name '*CraftBukkit*.jar' \
            -print -exec cp {} artifacts/ \;
          if ! find artifacts -name '*.jar' -print -quit | grep -q .; then
            echo "ERROR: No Paper/CraftBukkit JAR was generated."
            exit 1
          fi

      - name: Upload Paper JAR
        uses: actions/upload-artifact@v4
        with:
          name: Iris-Paper-26.2
          path: artifacts/*.jar
          if-no-files-found: error
          retention-days: 14
