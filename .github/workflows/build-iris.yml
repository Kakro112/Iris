name: Build Iris for Paper 26.2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - arena/d71f50a6-iris

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Iris 26.2 release
        uses: actions/checkout@v5
        with:
          repository: VolmitSoftware/Iris
          ref: 4.1.1-26.1.2-26.2
          fetch-depth: 1

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Paper plugin
        shell: bash
        run: |
          set -o pipefail
          java -version 2>&1 | tee gradle-build.log
          ./gradlew buildBukkit --no-daemon -PuseLocalVolmLib=false --stacktrace 2>&1 | tee -a gradle-build.log

      - name: Report failure details
        if: failure()
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import os

          def encode(text: str) -> str:
              return text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          path = 'gradle-build.log'
          if not os.path.exists(path):
              print('::error title=Build log missing::gradle-build.log was not produced')
              raise SystemExit(0)

          with open(path, 'rb') as handle:
              log = handle.read().decode('utf-8', 'replace')[-20000:]

          chunks = []
          current = ''
          for line in log.splitlines(keepends=True):
              encoded_line = encode(line)
              if len(current) + len(encoded_line) > 3500:
                  chunks.append(current)
                  current = encoded_line
              else:
                  current += encoded_line
          if current:
              chunks.append(current)

          chunks = chunks[-9:]
          for index, chunk in enumerate(chunks, 1):
              print(f'::error title=Gradle log {index}/{len(chunks)}::{chunk}')

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Gradle failure tail\n\n```\n')
              summary.write(log[-6000:])
              summary.write('\n```\n')
          PYEOF

      - name: Locate generated JARs
        if: always()
        shell: bash
        run: |
          echo "Searching for generated JAR files..."
          find . ../PluginOuts -type f -name '*.jar' 2>/dev/null || true

      - name: Collect Paper plugin JAR
        if: success()
        shell: bash
        run: |
          mkdir -p artifacts

          find ../PluginOuts . \
            -type f \
            -name '*CraftBukkit*.jar' \
            ! -path './artifacts/*' \
            ! -path './gradle/*' \
            -exec cp {} artifacts/ \; 2>/dev/null || true

          if [ -z "$(find artifacts -type f -name '*.jar' -print -quit)" ]; then
            echo "No CraftBukkit plugin JAR found."
            echo "Check the Locate generated JARs step for the actual output path."
            exit 1
          fi

          ls -lh artifacts

      - name: Upload Paper plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Iris-Paper-26.2
          path: artifacts/*.jar
          if-no-files-found: error
          retention-days: 14
